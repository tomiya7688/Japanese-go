name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate UTF-8 Markdown and JSON files
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          failures = []
          checked = 0
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in {".git", "node_modules", ".venv"} for part in path.parts):
                  continue
              if path.suffix.lower() not in {".md", ".json"}:
                  continue
              try:
                  content = path.read_text(encoding="utf-8-sig")
                  if "\x00" in content:
                      raise ValueError("contains a NUL byte")
                  if path.suffix.lower() == ".json":
                      json.loads(content)
                  checked += 1
              except (UnicodeError, ValueError) as exc:
                  failures.append(f"{path}: {exc}")

          print(f"Validated {checked} Markdown/JSON files")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          PY

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build jgo
        run: go build -o /tmp/jgo ./cmd/jgo
      - name: Compile and run natural syntax example
        run: |
          /tmp/jgo compile examples/natural-syntax.jgo -o /tmp/natural-syntax.go
          go run /tmp/natural-syntax.go
      - name: Run concurrency example through jgo
        run: /tmp/jgo run examples/natural-concurrency.jgo
      - name: Build native binary through jgo
        run: |
          /tmp/jgo build examples/natural-syntax.jgo -o /tmp/natural-syntax
          /tmp/natural-syntax
